name: Add vault
run-name: "Add vault: ${{ inputs.name }} ${{ inputs.request_id }}"

# Adds a vault from GitHub's Actions tab → "Add vault" → "Run workflow",
# or from Telegram with /addvault (the bot triggers this workflow through the API).
# Symbol and decimals are read on-chain; the workflow validates, runs the tests
# and opens a Pull Request (or pushes straight to main if requested).
#
# ⚠️ The "chain" and "type" options must stay identical to
# chainOptionLabel / TYPE_OPTION_LABELS (lib/vaultBuilder.js) — checked by npm test.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name shown in Telegram (e.g. Gami WBTC)"
        required: true
      address:
        description: "Address of the contract that emits the events (0x…)"
        required: true
      chain:
        description: "Chain"
        required: true
        type: choice
        options:
          - "1 - Ethereum"
          - "8453 - Base"
          - "43114 - Avalanche"
          - "43111 - Hemi"
          - "14 - Flare"
          - "4663 - Robinhood Chain"
      type:
        description: "Vault type"
        required: true
        type: choice
        options:
          - "erc7540 - Lagoon / T3tris (Request Deposit / Request Withdraw)"
          - "erc4626 - Upshift (Deposit / Withdraw)"
          - "midas-deposit - Midas DepositVault"
          - "midas-redeem - Midas RedemptionVault"
      asset_address:
        description: "Midas only: payment token (e.g. USDC). Leave empty otherwise."
        required: false
      share_symbol:
        description: "Optional: override the share symbol (read on-chain otherwise)"
        required: false
      direct_commit:
        description: "Push straight to main (otherwise: open a Pull Request)"
        type: boolean
        default: false
      request_id:
        description: "Internal (Telegram bot) — leave empty"
        required: false

permissions:
  contents: write
  pull-requests: write

# Two simultaneous additions run one after the other (avoids conflicts on vaults.json)
concurrency:
  group: add-vault
  cancel-in-progress: false

jobs:
  add-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Add the vault (on-chain read)
        id: add
        env:
          IN_NAME: ${{ inputs.name }}
          IN_ADDRESS: ${{ inputs.address }}
          IN_CHAIN: ${{ inputs.chain }}
          IN_TYPE: ${{ inputs.type }}
          IN_ASSET_ADDRESS: ${{ inputs.asset_address }}
          IN_SHARE_SYMBOL: ${{ inputs.share_symbol }}
        run: |
          args=(--name "$IN_NAME" --address "$IN_ADDRESS" --chain "$IN_CHAIN" --type "$IN_TYPE")
          [ -n "$IN_ASSET_ADDRESS" ] && args+=(--asset-address "$IN_ASSET_ADDRESS")
          [ -n "$IN_SHARE_SYMBOL" ] && args+=(--share-symbol "$IN_SHARE_SYMBOL")
          node scripts/add-vault.js "${args[@]}"

      - run: npm test

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.add.outputs.summary }}
          DIRECT: ${{ inputs.direct_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$DIRECT" = "true" ]; then
            git commit -am "add: vault $SUMMARY"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "✅ Pushed to main: $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            branch="add-vault/${{ github.run_id }}"
            git checkout -b "$branch"
            git commit -am "add: vault $SUMMARY"
            git push origin "$branch"
            url=$(gh pr create --base main --head "$branch" \
              --title "add: vault $SUMMARY" \
              --body "Added automatically by the **Add vault** workflow.

          \`\`\`diff
          $(git diff HEAD~1 -- vaults.json)
          \`\`\`

          Check the name, symbols and decimals, then merge: the bot redeploys.")
            echo "✅ Pull Request: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
